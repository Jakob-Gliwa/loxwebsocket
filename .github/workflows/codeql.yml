name: codeql

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
