name: tests

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.10 (see pyproject.toml).
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # setup-uv v8 ships immutable releases with no moving major tag, so
        # pin the exact version instead of @v8.
        uses: astral-sh/setup-uv@v10.3.2

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # --locked: install exactly the versions from uv.lock (so Dependabot PRs
      # that bump the lockfile are what actually gets tested) and fail if
      # uv.lock is out of sync with pyproject.toml. Builds the Cython extractor.
      - name: Install from lockfile
        run: uv sync --locked --python ${{ matrix.python-version }} --extra test

      - name: Run tests (skip live)
        run: uv run --no-sync pytest -m "not live"

  lint-type:
    name: ruff + mypy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dev dependencies from lockfile
        run: uv sync --locked --python 3.12 --extra dev

      - name: Ruff (lint)
        run: uv run --no-sync ruff check .

      - name: Mypy (type check)
        run: uv run --no-sync mypy src/loxwebsocket
